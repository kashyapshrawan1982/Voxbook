workflows:
  android-workflow:
    name: Android Zip Build
    environment:
      java: 17
    scripts:
      - name: Unzip Project
        script: |
          unzip -o *.zip -d android_project || true
          
      - name: Inject API Key (Fix Translate & Audio)
        script: |
          PROJECT_DIR=$(dirname $(find android_project -name "settings.gradle*" | head -n 1))
          cd $PROJECT_DIR
          
          # Aapki secret Gemini API Key ko app mein insert kar rahe hain
          find . -name "*.kt" -exec sed -i.bak 's/BuildConfig\.GEMINI_API_KEY/"AIzaSyAtgFSzjlH9KR_ZbiB72wV5ogYjB5R0LRQ"/g' {} +

      - name: Build Debug APK
        script: |
          PROJECT_DIR=$(dirname $(find android_project -name "settings.gradle*" | head -n 1))
          cd $PROJECT_DIR
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          export _JAVA_OPTIONS="-Djava.awt.headless=true"
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android_project/**/app/build/outputs/apk/**/*.apk
