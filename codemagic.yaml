workflows:
  android-workflow:
    name: Android Zip Build
    environment:
      java: 17
    scripts:
      - name: Unzip Project
        script: |
          unzip -o *.zip -d android_project || true
          
      - name: Read Problematic Code
        script: |
          PROJECT_DIR=$(dirname $(find android_project -name "settings.gradle*" | head -n 1))
          
          echo "================ KOTLIN CODE START ================"
          cat $PROJECT_DIR/app/src/main/java/com/example/data/translation/TranslationService.kt
          echo "================ KOTLIN CODE END ================"
          
          # Yahan process rok denge taaki aage faaltu errors na aayen
          exit 1
