workflows:
  android-workflow:
    name: Android Zip Build
    environment:
      java: 17
    scripts:
      - name: Unzip Project
        script: |
          unzip -o *.zip -d android_project || true
      - name: Build Debug APK
        script: |
          PROJECT_DIR=$(dirname $(find android_project -name "settings.gradle*" | head -n 1))
          cd $PROJECT_DIR
          
          export _JAVA_OPTIONS="-Djava.awt.headless=true"
          # System Gradle ka use kar rahe hain kyunki zip me gradlew nahi hai
          gradle assembleDebug --no-daemon
    artifacts:
      - android_project/**/app/build/outputs/apk/**/*.apk
