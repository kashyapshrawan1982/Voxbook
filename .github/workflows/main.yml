name: Android Build from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      _JAVA_OPTIONS: "-Djava.awt.headless=true"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project & Find Root
      run: |
        unzip -o *.zip -d android_project || true
        PROJECT_DIR=$(dirname $(find android_project -name "settings.gradle*" | head -n 1))
        echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Fix AI Hallucination & Remove Faulty KSP Plugin
      run: |
        cd ${{ env.PROJECT_PATH }}
        # Yeh command build files se us error dene wale ksp plugin ko hata degi
        find . -name "build.gradle*" -type f -exec sed -i '/ksp/d' {} +
        find . -name "*.kts" -type f -exec sed -i '/ksp/d' {} + || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_PATH }}
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk
