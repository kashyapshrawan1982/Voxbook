name: Android Build from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      _JAVA_OPTIONS: "-Djava.awt.headless=true"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project & Find Root
      run: |
        unzip -o *.zip -d android_project || true
        PROJECT_DIR=$(dirname $(find android_project -name "settings.gradle*" | head -n 1))
        echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Missing Keystore
      run: |
        cd ${{ env.PROJECT_PATH }}
        # Yeh line missing keystore file create karegi
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_PATH }}
        # --no-configuration-cache purane errors ko aane se rokega
        gradle assembleDebug --no-daemon --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk
